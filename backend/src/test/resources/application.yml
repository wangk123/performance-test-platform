spring:
  test:
    database:
      # 禁止 Boot 用无 MODE=MySQL 的内嵌 H2 顶替数据源（否则 V1 的 bit(1)/AUTO_INCREMENT 等无法解析）
      replace: none
  datasource:
    url: jdbc:h2:mem:datatest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    placeholders:
      # V1 中 @Lob String 列在 H2 侧需为 CLOB 才能通过 Hibernate validate（MySQL 侧主配置给 longtext）
      lob_type: clob
  jpa:
    hibernate:
      ddl-auto: validate
