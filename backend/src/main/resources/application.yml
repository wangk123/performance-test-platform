spring:
  application:
    name: performance-test-platform
  datasource:
    url: jdbc:h2:file:./storage/perftest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

server:
  port: 8080

platform:
  storage:
    root: ./storage
  execution:
    max-concurrent-tasks: 1
    failure-sample:
      per-label-limit: 50
      global-limit: 1000
      tail-interval-ms: 3000
    aggregate:
      snapshot-flush-ms: 1000
      fetch-interval-ms: 3000
      histogram-max-ms: 3600000
      histogram-precision: 3
  jmeter:
    executable: ${JMETER_EXECUTABLE:/Users/wangk/Documents/config/apache-jmeter-5.6.3/bin/jmeter}
    java-home: ${JMETER_JAVA_HOME:/Users/wangk/Documents/config/jdk-17.0.17+10/Contents/Home}
  distributed:
    runner:
      python: ${REMOTE_RUNNER_PYTHON:python3}
      entry: ${REMOTE_RUNNER_ENTRY:./remote-runner/remote_jmeter_runner/main.py}
      connect-timeout-seconds: ${REMOTE_RUNNER_CONNECT_TIMEOUT_SECONDS:120}
      idle-timeout-seconds: ${REMOTE_RUNNER_IDLE_TIMEOUT_SECONDS:300}
      poll-interval-seconds: ${REMOTE_RUNNER_POLL_INTERVAL_SECONDS:10}
  monitoring:
    deploy:
      bundle-path: ${MONITORING_DEPLOY_BUNDLE_PATH:../deploy/monitoring/prometheus}
    prometheus:
      file-sd-path: ${PROMETHEUS_JMX_FILE_SD_PATH:./deploy/monitoring/prometheus/file_sd/jmx-targets.json}
      # 空默认：未显式配置 PROMETHEUS_BASE_URL 时资源指标通道不可用，避免误连环境特定地址
      base-url: ${PROMETHEUS_BASE_URL:}
      connect-timeout-ms: ${PROMETHEUS_CONNECT_TIMEOUT_MS:3000}
      request-timeout-ms: ${PROMETHEUS_REQUEST_TIMEOUT_MS:10000}
  seed:
    credential-secret: ${SEED_CREDENTIAL_SECRET:perftest-seed-default-key!}
    max-clone-count: ${SEED_MAX_CLONE_COUNT:10000}
    disk-low-water-bytes: ${SEED_DISK_LOW_WATER_BYTES:1073741824}
    capture:
      heartbeat-timeout-seconds: ${SEED_CAPTURE_HEARTBEAT_TIMEOUT_SECONDS:300}
  governance:
    enabled: true
    rate-limit:
      window-millis: 10000
      human-capacity: 120
      machine-capacity: 600
      anonymous-capacity: 30
      max-in-flight-human: 10
      max-in-flight-machine: 50
      max-in-flight-anonymous: 5
  verification:
    p95-regression-pct: 5.0
    significant-pct: 5.0
    error-rate-increase-pct: 0.01
  evidence:
    deep:
      kinds:
        db-metrics:
          enabled: false
          retention-days: 7
          promql-templates:
            connection-pool: "sum by (instance) (jdbc_connections_active)"
            slow-query-count: "sum by (instance) (rate(jdbc_slow_queries_total[5m]))"
            lock-waits: "sum by (instance) (jdbc_lock_waits_total)"
        trace:
          enabled: false
          retention-days: 7
        app-log:
          enabled: false
          retention-days: 7
        slow-sql:
          enabled: false
          retention-days: 7
        profiling:
          enabled: false
          retention-days: 7
  auxscript:
    timeout-seconds: ${AUX_SCRIPT_TIMEOUT_SECONDS:60}
