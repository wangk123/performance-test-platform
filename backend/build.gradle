plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.yr.perftest'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'
    implementation 'org.hdrhistogram:HdrHistogram:2.2.2'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // XDocReport — Word 报告生成
    implementation 'fr.opensagres.xdocreport:fr.opensagres.xdocreport.document.docx:2.1.0'
    implementation 'fr.opensagres.xdocreport:fr.opensagres.xdocreport.template.freemarker:2.1.0'

    // MCP Java SDK — Streamable HTTP MCP Server（T12）
    implementation 'io.modelcontextprotocol.sdk:mcp:1.1.3'

    // JGit — Git 仓库提交记录导入（模块 10）
    implementation 'org.eclipse.jgit:org.eclipse.jgit:7.7.1.202607240634-r'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('processResources') {
    dependsOn ':jmeter-functions:copyToBackendRuntime'
}
