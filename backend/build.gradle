plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.yr.perftest'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    testImplementation 'org.testcontainers:mysql'
    // @Testcontainers/@Container JUnit 5 扩展与 @ServiceConnection 连接详情
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'
    implementation 'org.hdrhistogram:HdrHistogram:2.2.2'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // XDocReport — Word 报告生成
    implementation 'fr.opensagres.xdocreport:fr.opensagres.xdocreport.document.docx:2.1.0'
    implementation 'fr.opensagres.xdocreport:fr.opensagres.xdocreport.template.freemarker:2.1.0'

    // MCP Java SDK — Streamable HTTP MCP Server（T12）
    implementation 'io.modelcontextprotocol.sdk:mcp:1.1.3'

    // JGit — Git 仓库提交记录导入（模块 10）
    implementation 'org.eclipse.jgit:org.eclipse.jgit:7.7.1.202607240634-r'

    // openhtmltopdf — 报告 PDF 导出（模块 06 增强）
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        // P0-4：真 MySQL Testcontainers 用例只走 testMysql（Gradle 9 起 Test 任务不再默认
        // 按 *Test 文件名过滤，须显式按 tag 隔离，避免默认套件误发现/误跑 *IT）
        excludeTags 'mysql'
    }
    // 全量套件含 40+ 个 @SpringBootTest 上下文，默认 512m 堆会 OOM（P0-1/P0-2 基线各自实测）
    maxHeapSize = '2g'
}

tasks.named('processResources') {
    dependsOn ':jmeter-functions:copyToBackendRuntime'
}

// P0-4：Testcontainers 真 MySQL 集成测试（用例按 @Tag("mysql") 隔离：默认 test excludeTags /
// 本任务 includeTags；Gradle 9 的 Test 任务已无 *Test 文件名默认过滤，须显式 tag 隔离）。
// 经 DOCKER_HOST 可指向远程 Docker（本机无 Docker 时走 SSH unix-socket 隧道 → 216）：
//   DOCKER_HOST=unix:///tmp/p024-docker.sock TESTCONTAINERS_HOST_OVERRIDE=192.168.17.216 \
//   TESTCONTAINERS_RYUK_DISABLED=true ./gradlew :backend:testMysql
tasks.register('testMysql', Test) {
    description = 'Testcontainers 真 MySQL 集成测试（需 Docker，经 DOCKER_HOST 可指向远程）'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'mysql'
    }
    maxHeapSize = '2g'
    shouldRunAfter tasks.named('test')
}
