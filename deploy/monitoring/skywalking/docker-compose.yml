services:
  skywalking-oap:
    image: apache/skywalking-oap-server:9.7.0
    ports: ["12800:12800", "11800:11800"]
    environment:
      SW_STORAGE: h2
      SW_HEALTH_CHECKER: default
      # 生产换 ES：SW_STORAGE: elasticsearch + SW_STORAGE_ES_CLUSTER_NODES: es:9200
    healthcheck:
      # OAP 镜像（eclipse-temurin JRE）不含 curl/wget/nc，用 bash /dev/tcp 探测 12800（对齐 apache/skywalking 官方 compose）
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/12800"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
  skywalking-ui:
    image: apache/skywalking-ui:9.7.0
    ports: ["8080:8080"]
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    depends_on:
      skywalking-oap:
        condition: service_healthy
